# Альтернатива Caddy: nginx + certbot (если приложение запущено без Docker через systemd).
# 1) sudo apt install nginx certbot python3-certbot-nginx
# 2) скопируйте файл: sudo cp deploy/nginx.conf /etc/nginx/sites-available/shop
#    sudo ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop
# 3) замените shop.example.com на ваш домен, затем: sudo nginx -t && sudo systemctl reload nginx
# 4) HTTPS: sudo certbot --nginx -d shop.example.com
server {
    listen 80;
    server_name shop.example.com;
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
